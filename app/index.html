<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com https://*.trycloudflare.com https://cloud-relay.heihei-relay-7vf1.workers.dev; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1013" media="(prefers-color-scheme: dark)">
<title>Agent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="btn-back" class="btn small ghost" type="button" aria-label="返回上一個主要頁" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span class="bl">返回</span></button>
  <h1 id="title">首頁</h1>
  <button id="remote-chip" class="remotechip off" type="button" aria-expanded="false" aria-controls="remote-card" aria-label="遠端狀態" hidden>關</button>
  <span id="updated" class="updated"></span>
  <button id="btn-refresh" class="btn small ghost ibtn" type="button" aria-label="重新整理"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  <button id="btn-more" class="btn small ghost ibtn" type="button" aria-label="更多"><svg class="i dots" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>
  <div id="remote-card" class="remotecard" hidden></div>
</header>
<div id="ptr" class="ptr" hidden>下拉重新整理</div>
<div id="banner" class="banner" hidden></div>
<button id="update" class="banner update" type="button" hidden>有新版本，點這裡更新</button>
<main id="view"></main>
<button id="sendpill" class="sendpill" type="button" hidden aria-live="polite"></button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav class="tabs" id="tabs">
  <button type="button" data-tab="home"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg></span><span class="lbl">首頁</span></button>
  <button type="button" data-tab="record"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span><span class="lbl">紀錄</span></button>
  <button type="button" data-tab="chat" class="center"><span class="cico"></span><span class="lbl"></span></button>
  <button type="button" data-tab="todo"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.7.4-1.2.9-1.2 1.7v.4"/><path d="M12 17h.01"/></svg></span><span class="lbl">問題</span></button>
  <button type="button" data-tab="tasks"><span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.3 2.4 2.4 4.6-4.9"/></svg></span><span class="lbl">任務</span></button>
</nav>
<!-- P66：線條圖示（app.js 用 lib/icons.js 的 icon() cloneNode 取用；不用 innerHTML、不連外部） -->
<template id="icons">
  <svg class="i" data-i="folder" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
  <svg class="i" data-i="bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5z"/><path d="M10 20.5h4"/></svg>
  <svg class="i" data-i="chart" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 16v-3M12 16V8.5M15.5 16v-5"/></svg>
  <svg class="i" data-i="pen" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="M13 7l4 4"/></svg>
  <svg class="i" data-i="pulse" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>
  <svg class="i" data-i="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.7A3.8 3.8 0 0 1 12 7.6a3.8 3.8 0 0 1 7 2.2c0 5.4-7 9.7-7 9.7z"/></svg>
  <svg class="i" data-i="gear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
  <svg class="i" data-i="doc" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/></svg>
  <svg class="i" data-i="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
</template>
<script type="module" src="app.js"></script>
</body>
</html>
